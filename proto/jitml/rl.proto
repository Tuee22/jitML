syntax = "proto3";

package jitml.rl;

// Envelope sent on `rl.command.<mode>` to drive an RL run via the daemon's
// RlHandler.
message StartRLRun {
  string experiment_hash = 1;
  string algorithm       = 2;  // PPO, DQN, AlphaZero, ...
  string environment     = 3;  // cartpole, mountain-car, ...
  string substrate       = 4;
  uint64 seed            = 5;
  uint32 max_steps       = 6;
  uint32 eval_episodes   = 7;
}

// AlphaZero uses generation-, game-, search-, and update-indexed budgets that
// are not interchangeable with StartRLRun's environment-step budget. Keeping
// it as a distinct command body prevents workers from reinterpreting a generic
// max_steps value for self-play.
message StartAlphaZeroRun {
  string substrate                 = 1;
  string experiment_hash           = 2;
  string plan_id                   = 3;
  string resolved_plan             = 4;
  string game                      = 5;
  uint32 generations               = 6;
  uint32 self_play_games           = 7;
  uint32 mcts_simulations_per_move = 8;
  uint32 max_plies                 = 9;
  uint32 optimizer_updates         = 10;
  uint32 arena_games               = 11;
  uint64 seed                      = 12;
}

message StopRLRun {
  string experiment_hash = 1;
  bool   drain = 2;
}

message EvaluationOutcome {
  string plan_id = 1;
  string experiment_hash = 2;
  uint64 episode_id = 3;
  double reward = 4;
  uint64 steps = 5;
  bool done = 6;
  uint64 timestamp_ns = 7;
}

message IterationSummary {
  string plan_id = 1;
  string experiment_hash = 2;
  uint64 iteration = 3;
  string metric_name = 4;
  double metric_value = 5;
  uint64 timestamp_ns = 6;
}

message CheckpointDoneRL {
  string experiment_hash = 1;
  string manifest_sha = 2;
  uint64 step = 3;
  string pointer_key = 4;
  uint32 protocol_version = 5;
}

message CompletedCheckpointDoneRL {
  uint32 protocol_version = 1;
  CheckpointDoneRL checkpoint = 2;
  bytes completed_training = 3;
}

message MetricUpdate {
  string experiment_hash = 1;
  string name = 2;
  double value = 3;
  uint64 timestamp_ns = 4;
  string plan_id = 5;
}

// Plan-correlated AlphaZero evidence. These shapes carry the exact generation
// and arena keys needed by the AlphaZero contract reducer, alongside the
// plan-correlated traditional-RL evidence above.
message GenerationCompleted {
  string plan_id         = 1;
  string experiment_hash = 2;
  uint32 generation      = 3;
  uint32 self_play_games = 4;
  uint64 samples         = 5;
}

message ArenaCompleted {
  string plan_id         = 1;
  string experiment_hash = 2;
  uint32 arena_games     = 3;
  double win_rate        = 4;
}

message RlAnimationFrame {
  string experiment_hash = 1;
  string environment = 2;
  uint32 episode = 3;
  uint32 step = 4;
  double reward = 5;
  bool done = 6;
  uint32 action = 7;
  repeated double observation = 8;
  repeated double action_probabilities = 9;
  uint32 observation_hash = 10;
  uint64 replay_cursor = 11;
  uint64 timestamp_ns = 12;
}

message RlReplayFrame {
  string experiment_hash = 1;
  string replay_id = 2;
  string environment = 3;
  uint32 episode = 4;
  uint32 step = 5;
  uint32 action = 6;
  double reward = 7;
  bool done = 8;
  repeated double observation = 9;
  repeated double next_observation = 10;
  uint64 policy_version = 11;
  uint32 observation_hash = 12;
  uint64 timestamp_ns = 13;
}

message RlCommand {
  oneof body {
    StartRLRun       start            = 1;
    StopRLRun        stop             = 2;
    StartAlphaZeroRun start_alpha_zero = 3;
  }
}

message RlEvent {
  oneof body {
    EvaluationOutcome evaluation = 1;
    IterationSummary iteration   = 2;
    CheckpointDoneRL checkpoint = 3;
    MetricUpdate     metric     = 4;
    RlAnimationFrame animation  = 5;
    RlReplayFrame    replay     = 6;
    GenerationCompleted generation_completed = 7;
    ArenaCompleted      arena_completed      = 8;
    CompletedCheckpointDoneRL completed_checkpoint = 9;
  }
}
