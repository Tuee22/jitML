syntax = "proto3";

package jitml.gc;

// Envelope published on `gc.event.<substrate>` after the `jitml internal gc`
// reconciler deletes a manifest and its committed storage snapshot from MinIO
// and records the exact fence decision as permanent Reaped. Publish-ready and
// semantic-intent terminal handling begins only from that Reaped state.
// `reaped_object_keys` is sorted and unique, belongs to exactly one snapshot
// namespace, and contains exactly that snapshot's `committed.cbor` plus every
// reaped payload-object key. The manifest is represented separately by
// `manifest_sha`; a zero-payload-object snapshot therefore has one reaped object
// key (its commit). The envelope also names the stored substrate, experiment,
// monotonic manifest step, fixed completion timestamp, and stable semantic event
// id. Idempotent DELETE acknowledgements include targets already absent.
// Consumers (observability stack and audit pipelines) subscribe to
// `gc.event.<substrate>` to follow the deletion stream.
message GcReapedEvent {
  string experiment_hash = 1;
  string manifest_sha = 2;
  repeated string reaped_object_keys = 3;
  uint64 step_at_reap = 4;
  string substrate = 5;
  uint64 timestamp_ns = 6;
  string event_id = 7;
}
