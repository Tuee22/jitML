apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitml-demo
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitml-demo
  template:
    metadata:
      annotations:
        checksum/live-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
      labels:
        app: jitml-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jitml-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          # Sprint 11.10 — the demo is the one-binary Webapp role: `jitml service`
          # with activeRole=Webapp (typed Dhall config), folding in the retired
          # `jitml-demo` executable. It serves the bundle + /api/ws bridge and
          # publishes inference WorkCommands to the Engine; it computes nothing.
          command: ["jitml", "service", "--config", "/etc/jitml/BootConfig.dhall"]
          workingDir: /jitml
          # Sprint 4.8 — pod budget from dhall/cluster/resources.dhall (`jitmlDemo`).
          # Sprint 15.20 — linux-cuda retains the raised budget from the live
          # product-matrix validation; Webapp compute is publish-only.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              {{- if eq .Values.substrate "linux-cuda" }}
              cpu: "2"
              memory: 4Gi
              {{- else }}
              cpu: "2"
              memory: 3Gi
              {{- end }}
          volumeMounts:
            - name: webapp-config
              mountPath: /etc/jitml
              readOnly: true
          ports:
            - name: http
              containerPort: 80
      volumes:
        - name: webapp-config
          configMap:
            name: jitml-webapp-config
