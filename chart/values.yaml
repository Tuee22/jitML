substrate: apple-silicon
edgePort: 9090

jitml:
  image:
    repository: jitml
    tag: local
  demoImage:
    repository: jitml-demo
    tag: local
  storageClass: jitml-manual

# The image registry. `bucket` is deliberately the name Harbor used: reusing it
# means the layers Harbor already wrote stay addressable, so replacing the
# registry required no blob migration. Renaming it is cosmetic and tracked in
# the removal ledger rather than done here.
registry:
  bucket: harbor-registry
  region: us-east-1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  mode: standalone
  replicas: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2024.11.7-debian-12-r0
  clientImage:
    registry: docker.io
    repository: bitnamilegacy/minio-client
    tag: 2024.10.29-debian-12-r1
  persistence:
    storageClass: jitml-manual
  provisioning:
    enabled: true
    buckets:
      - name: harbor-registry
      - name: jitml-checkpoints
      - name: jitml-datasets
      - name: jitml-transcripts
      - name: jitml-trials
      - name: jitml-tensorboard
      - name: jitml-artifacts

pulsar:
  zookeeper:
    replicaCount: 1
  bookkeeper:
    replicaCount: 1
  broker:
    replicaCount: 1
    restartPodsOnConfigMapChange: true
    configData:
      brokerDeleteInactiveTopicsEnabled: "false"
      webSocketServiceEnabled: "true"
      managedLedgerDefaultEnsembleSize: "1"
      managedLedgerDefaultWriteQuorum: "1"
      managedLedgerDefaultAckQuorum: "1"
  proxy:
    replicaCount: 1
    service:
      type: ClusterIP
  autorecovery:
    replicaCount: 1

kube-prometheus-stack:
  grafana:
    enabled: true
