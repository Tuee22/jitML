apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitml-service
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jitml-service
  template:
    metadata:
      annotations:
        checksum/live-config: {{ include (print $.Template.BasePath "/configmap-jitml-service.yaml") . | sha256sum | quote }}
      labels:
        app: jitml-service
        jitml.substrate: linux-cuda
        jitml.role: engine
        jitml.compute: "true"
        jitml.compute-scope: service
    spec:
      serviceAccountName: jitml-engine
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        jitml.node-role/compute: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  jitml.compute: "true"
                  jitml.compute-scope: service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              jitml.compute: "true"
              jitml.compute-scope: service
      containers:
        - name: jitml-service
          image: jitml:local
          imagePullPolicy: IfNotPresent
          command: ["jitml"]
          args: ["service", "--config", "/etc/jitml/BootConfig.dhall"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          volumeMounts:
            - name: jit-cache
              mountPath: /opt/build
            - name: service-config
              mountPath: /etc/jitml
      volumes:
        - name: jit-cache
          hostPath:
            path: /jitml/.build
        - name: service-config
          configMap:
            name: jitml-service-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitml-coordinator
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jitml-coordinator
  template:
    metadata:
      annotations:
        checksum/live-config: {{ include (print $.Template.BasePath "/configmap-jitml-service.yaml") . | sha256sum | quote }}
      labels:
        app: jitml-coordinator
        jitml.substrate: linux-cuda
        jitml.role: coordinator
        jitml.compute: "false"
    spec:
      serviceAccountName: jitml-coordinator
      containers:
        - name: jitml-coordinator
          image: jitml:local
          imagePullPolicy: IfNotPresent
          command: ["jitml"]
          args: ["service", "--config", "/etc/jitml/BootConfig.dhall"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: service-config
              mountPath: /etc/jitml
      volumes:
        - name: service-config
          configMap:
            name: jitml-coordinator-config
