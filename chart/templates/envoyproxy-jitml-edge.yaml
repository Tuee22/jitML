apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: jitml-edge
  namespace: platform
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          value:
            spec:
              ports:
                - name: http
                  port: 9091
                  nodePort: 30090
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      readinessProbe:
                        failureThreshold: 12
                        periodSeconds: 5
                        timeoutSeconds: 10
                      startupProbe:
                        failureThreshold: 60
                        periodSeconds: 10
                        timeoutSeconds: 10
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: "25m"
                          memory: "64Mi"
                        limits:
                          cpu: "250m"
                          memory: "512Mi"
                      livenessProbe:
                        failureThreshold: 12
                        periodSeconds: 10
                        timeoutSeconds: 5
                      readinessProbe:
                        failureThreshold: 12
                        periodSeconds: 10
                        timeoutSeconds: 5
                      startupProbe:
                        failureThreshold: 60
                        periodSeconds: 10
                        timeoutSeconds: 5
