apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry
  namespace: platform
  labels:
    app.kubernetes.io/part-of: jitml
spec:
  parentRefs:
    - name: jitml-edge
      namespace: platform
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      timeouts:
        request: 120s
        backendRequest: 120s
      backendRefs:
        - name: registry
          port: 5000
