image:
  registry: docker.io
  repository: bitnamilegacy/minio
  tag: 2024.11.7-debian-12-r0

clientImage:
  registry: docker.io
  repository: bitnamilegacy/minio-client
  tag: 2024.10.29-debian-12-r1

mode: standalone
replicas: 1

# Phase 53 — single-instance pod resource budget from dhall/cluster/resources.dhall (`minio`).
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Local live validation can drive large routed object reads while the same
# MinIO also serves Harbor and checkpoint traffic. Keep probes from killing a
# healthy but saturated local instance during those bursts.
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 20
  failureThreshold: 12

readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 12

startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60

auth:
  rootUser: minio
  rootPassword: minioadmin

provisioning:
  enabled: true
  buckets:
    - name: harbor-registry
      versioning: Unchanged
    - name: jitml-checkpoints
      versioning: Unchanged
    - name: jitml-datasets
      versioning: Unchanged
    - name: jitml-transcripts
      versioning: Unchanged
    - name: jitml-trials
      versioning: Unchanged
    - name: jitml-tensorboard
      versioning: Unchanged
    - name: jitml-artifacts
      versioning: Unchanged

persistence:
  enabled: true
  storageClass: jitml-manual
  size: 20Gi

volumes:
  persistence: true

podAntiAffinityPreset: soft
